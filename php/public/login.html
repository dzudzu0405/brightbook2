<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log In — BrightBook AI</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="landing-body">
  <nav class="landing-nav">
    <a class="landing-brand" href="index.html">
      <span>✦</span>
      <strong>BrightBook AI</strong>
    </a>
    <div class="landing-actions" style="margin-left:auto">
      <a class="link-login" href="index.html">← Back to site</a>
    </div>
  </nav>

  <main class="login-main">
    <div class="login-card">
      <div class="login-icon">✦</div>
      <h1>Log in to BrightBook</h1>
      <p>Enter the email you used to purchase to open your workspace.</p>

      <form id="loginForm" novalidate>
        <label>
          <span>Email Address</span>
          <input type="email" id="emailInput" placeholder="you@example.com" autocomplete="email">
        </label>
        <button type="submit" class="hero-primary login-submit" id="loginSubmit">Log In <span>→</span></button>
        <p class="login-error hidden" id="loginError"></p>
      </form>

      <div class="login-divider"><span>or</span></div>
      <a class="login-demo" href="app.html">Try the free demo instead →</a>

      <p class="login-help">Haven't purchased yet? <a href="index.html#pricing">See pricing</a>.</p>
    </div>
  </main>

  <script>
    (function () {
      const STORAGE_KEY = "brightbookUserToken";
      const form = document.getElementById("loginForm");
      const input = document.getElementById("emailInput");
      const errorEl = document.getElementById("loginError");
      const submitBtn = document.getElementById("loginSubmit");

      function showError(message) {
        errorEl.textContent = message;
        errorEl.classList.remove("hidden");
      }

      function clearError() {
        errorEl.classList.add("hidden");
      }

      function setLoading(loading) {
        submitBtn.disabled = loading;
        submitBtn.innerHTML = loading ? "Checking..." : "Log In <span>→</span>";
      }

      async function logIn(email, { silent = false } = {}) {
        if (!email) return false;
        if (!silent) { clearError(); setLoading(true); }
        try {
          const res = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || "That email did not work. Please try again.");
          localStorage.setItem(STORAGE_KEY, data.user.token);
          location.href = "app.html";
          return true;
        } catch (err) {
          if (!silent) showError(err.message);
          return false;
        } finally {
          if (!silent) setLoading(false);
        }
      }

      // Purchase-delivery links can pre-fill and auto-log-in via ?email=...
      const qsEmail = new URLSearchParams(location.search).get("email");
      if (qsEmail) {
        input.value = qsEmail;
        logIn(qsEmail);
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const email = input.value.trim();
        if (!email) { showError("Please enter your email address."); return; }
        logIn(email);
      });
    })();
  </script>
</body>
</html>
