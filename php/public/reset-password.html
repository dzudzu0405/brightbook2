<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password — BrightBook AI</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="landing-body">
  <nav class="landing-nav">
    <a class="landing-brand" href="index.html">
      <span>✦</span>
      <strong>BrightBook AI</strong>
    </a>
    <div class="landing-actions" style="margin-left:auto">
      <a class="link-login" href="login.html">← Back to login</a>
    </div>
  </nav>

  <main class="login-main">
    <div class="login-glow"></div>
    <div class="float-icon login-fi-1">⌘</div>
    <div class="float-icon login-fi-2">✎</div>
    <div class="float-icon login-fi-3">▧</div>
    <div class="float-icon login-fi-4">♪</div>

    <div class="login-card">
      <div class="login-badge">✦ Set a new password</div>
      <div class="login-icon">✦</div>
      <h1>Reset your password</h1>
      <p>Paste the reset link/token your seller sent you, then choose a new password.</p>

      <form id="resetForm" novalidate>
        <label>
          <span>Reset Token</span>
          <input type="text" id="tokenInput" placeholder="reset_xxxxxxxxxxxxxxxx" autocomplete="off" spellcheck="false">
        </label>
        <label>
          <span>New Password</span>
          <input type="password" id="passwordInput" placeholder="••••••••" autocomplete="new-password">
        </label>
        <label>
          <span>Confirm New Password</span>
          <input type="password" id="confirmInput" placeholder="••••••••" autocomplete="new-password">
        </label>
        <button type="submit" class="hero-primary login-submit" id="submitBtn">Reset Password <span>→</span></button>
        <p class="login-error hidden" id="errorEl"></p>
        <p class="login-success hidden" id="successEl"></p>
      </form>

      <p class="login-footnote"><a href="login.html">Back to log in</a></p>
    </div>
  </main>

  <script>
    (function () {
      const form = document.getElementById("resetForm");
      const tokenInput = document.getElementById("tokenInput");
      const passwordInput = document.getElementById("passwordInput");
      const confirmInput = document.getElementById("confirmInput");
      const errorEl = document.getElementById("errorEl");
      const successEl = document.getElementById("successEl");
      const submitBtn = document.getElementById("submitBtn");

      const qsToken = new URLSearchParams(location.search).get("token");
      if (qsToken) tokenInput.value = qsToken;

      function showError(message) {
        successEl.classList.add("hidden");
        errorEl.textContent = message;
        errorEl.classList.remove("hidden");
      }
      function showSuccess(message) {
        errorEl.classList.add("hidden");
        successEl.textContent = message;
        successEl.classList.remove("hidden");
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorEl.classList.add("hidden");
        successEl.classList.add("hidden");
        const token = tokenInput.value.trim();
        const password = passwordInput.value;
        if (!token) { showError("Please paste your reset token."); return; }
        if (password.length < 8) { showError("Password must be at least 8 characters."); return; }
        if (password !== confirmInput.value) { showError("Passwords do not match."); return; }

        submitBtn.disabled = true;
        submitBtn.textContent = "Please wait...";
        try {
          const res = await fetch("/api/reset-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token, password }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || "Could not reset your password.");
          showSuccess("Password reset. You can now log in with your new password.");
          form.reset();
        } catch (err) {
          showError(err.message);
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerHTML = "Reset Password <span>→</span>";
        }
      });
    })();
  </script>
</body>
</html>
